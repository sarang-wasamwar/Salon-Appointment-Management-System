<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SalonSnap</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --orange-soft: #ff9a3c;
            --orange-light: #ffb066;
            --orange-pale: #ffe2cc;
            --orange-cream: #fff7f0;
            --pure-white: #ffffff;
            --dark-text: #7a4a2e;
            --accent: #ff7a00;
            --shadow: 0 10px 30px rgba(255,154,60,0.18);
        }

        body {
            background: linear-gradient(135deg, #fff7f0, #ffe2cc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-type-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }

        .user-type-btn {
            flex: 1;
            padding: 18px;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            position: relative;
        }

        .user-type-btn i {
            margin-right: 8px;
        }

        .user-type-btn.active {
            color: var(--accent);
            background: white;
        }

        .user-type-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
        }

        .user-type-btn:hover:not(.active) {
            background: #f0f0f0;
            color: var(--dark-text);
        }

        .login-content {
            padding: 30px;
        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            font-size: 1.8rem;
            color: var(--dark-text);
            margin-bottom: 8px;
        }

        .form-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-text);
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 3px rgba(255,122,0,0.1);
        }

        .password-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 1.1rem;
        }

        .toggle-password:hover {
            color: var(--accent);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--orange-soft));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,122,0,0.4);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .register-link p {
            color: #666;
            font-size: 0.9rem;
        }

        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .back-home a:hover {
            color: var(--accent);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="user-type-tabs">
                <button class="user-type-btn active" onclick="switchUserType('customer')">
                    <i class="fas fa-user"></i> Customer
                </button>
                <button class="user-type-btn" onclick="switchUserType('admin')">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
            </div>

            <div class="login-content">
                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <div id="customerLoginForm" class="login-form active">
                    <div class="form-header">
                        <h2>Customer Login</h2>
                        <p>Login to book appointments and view your history</p>
                    </div>
                    <form id="customerLoginFormElement" onsubmit="handleCustomerLogin(event)">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="customerEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <div class="password-field">
                                <input type="password" id="customerPassword" placeholder="Enter your password" required>
                                <button type="button" class="toggle-password" onclick="togglePassword('customerPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="login-btn">Login</button>
                    </form>
                    <div class="register-link">
                        <p>Don't have an account? <a href="#" onclick="showCustomerRegister()">Register here</a></p>
                    </div>
                </div>

                <div id="customerRegisterForm" class="login-form">
                    <div class="form-header">
                        <h2>Customer Registration</h2>
                        <p>Create your account to book appointments</p>
                    </div>
                    <form id="customerRegisterFormElement" onsubmit="handleCustomerRegister(event)">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="regFullName" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="regEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="regPhone" placeholder="+1 234 567 8900" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <div class="password-field">
                                <input type="password" id="regPassword" placeholder="Create a password (min 6 characters)" required>
                                <button type="button" class="toggle-password" onclick="togglePassword('regPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <div class="password-field">
                                <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                                <button type="button" class="toggle-password" onclick="togglePassword('regConfirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="login-btn">Register</button>
                    </form>
                    <div class="register-link">
                        <p>Already have an account? <a href="#" onclick="showCustomerLogin()">Login here</a></p>
                    </div>
                </div>

                <div id="adminLoginForm" class="login-form">
                    <div class="form-header">
                        <h2>Admin Login</h2>
                        <p>Access the admin dashboard to manage salon operations</p>
                    </div>
                    <form id="adminLoginFormElement" onsubmit="handleAdminLogin(event)">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="adminUsername" placeholder="Enter admin username" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <div class="password-field">
                                <input type="password" id="adminPassword" placeholder="Enter your password" required>
                                <button type="button" class="toggle-password" onclick="togglePassword('adminPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="login-btn">Login</button>
                    </form>
                </div>
            </div>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        let currentUserType = 'customer';

        function switchUserType(type) {
            currentUserType = type;
            
            document.querySelectorAll('.user-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (type === 'customer') {
                document.querySelector('.user-type-btn:first-child').classList.add('active');
            } else {
                document.querySelector('.user-type-btn:last-child').classList.add('active');
            }
            
            document.getElementById('customerLoginForm').classList.remove('active');
            document.getElementById('customerRegisterForm').classList.remove('active');
            document.getElementById('adminLoginForm').classList.remove('active');
            
            if (type === 'customer') {
                document.getElementById('customerLoginForm').classList.add('active');
            } else {
                document.getElementById('adminLoginForm').classList.add('active');
            }
            
            hideError();
        }

        function showCustomerLogin() {
            document.getElementById('customerLoginForm').classList.add('active');
            document.getElementById('customerRegisterForm').classList.remove('active');
            hideError();
        }

        function showCustomerRegister() {
            document.getElementById('customerRegisterForm').classList.add('active');
            document.getElementById('customerLoginForm').classList.remove('active');
            hideError();
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling?.querySelector('i') || 
                        input.parentElement.querySelector('.toggle-password i');
            
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                if (icon) icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 3000);
        }

        async function handleCustomerLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('customerEmail').value;
            const password = document.getElementById('customerPassword').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('customer_id', data.customer_id);
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userType', 'customer');
                    localStorage.setItem('userEmail', email);
                    
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please try again.');
            }
        }

        async function handleCustomerRegister(event) {
            event.preventDefault();
            
            const full_name = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, phone, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('customer_id', data.customer_id);
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userType', 'customer');
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userName', full_name);
                    
                    showSuccess('Registration successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showError(data.error || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showError('Network error. Please try again.');
            }
        }

        async function handleAdminLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminUsername', username);
                    localStorage.setItem('adminLoginTime', new Date().toISOString());
                    localStorage.setItem('userType', 'admin');
                    if (data.token) {
                        localStorage.setItem('adminToken', data.token);
                    }
                    
                    showSuccess('Admin login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);
                } else {
                    showError(data.error || 'Invalid admin credentials');
                }
            } catch (error) {
                console.error('Admin login error:', error);
                showError('Network error. Please try again.');
            }
        }
    </script>
</body>
</html>
