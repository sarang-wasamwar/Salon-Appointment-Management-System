<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - SalonSnap</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff7f0, #ffe2cc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .success-icon i {
            font-size: 40px;
            color: white;
        }

        h1 {
            color: #27ae60;
            margin-bottom: 10px;
        }

        .payment-details {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            font-weight: 600;
            color: #7a4a2e;
        }

        .detail-value {
            color: #333;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff9a3c, #ff7a00);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Payment Successful!</h1>
        <p>Your appointment has been confirmed.</p>

        <div class="payment-details" id="paymentDetails">
            <div class="detail-row">
                <span class="detail-label">Receipt No:</span>
                <span class="detail-value" id="receiptNo">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Service:</span>
                <span class="detail-value" id="serviceName">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount Paid:</span>
                <span class="detail-value" id="amount">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment Method:</span>
                <span class="detail-value" id="paymentMethod">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Transaction ID:</span>
                <span class="detail-value" id="transactionId">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Date:</span>
                <span class="detail-value" id="paymentDate">-</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="downloadReceipt()">
                <i class="fas fa-download"></i> Download Receipt
            </button>
            <a href="dashboard.html" class="btn btn-secondary">
                <i class="fas fa-user"></i> My Dashboard
            </a>
        </div>
    </div>

    <script>
        let currentReceiptUrl = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentId = urlParams.get('payment_id');
            
            if (!paymentId) {
                alert('Invalid payment details');
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch(`/api/payments/${paymentId}`);
                const payment = await response.json();

                if (payment) {
                    document.getElementById('receiptNo').textContent = `#${payment.payment_id}`;
                    document.getElementById('serviceName').textContent = payment.service_name || '-';
                    document.getElementById('amount').textContent = `₹${parseFloat(payment.amount).toFixed(2)}`;
                    document.getElementById('paymentMethod').textContent = payment.payment_method;
                    document.getElementById('transactionId').textContent = payment.transaction_id || 'N/A';
                    document.getElementById('paymentDate').textContent = new Date(payment.payment_date).toLocaleString();
                    
                    currentReceiptUrl = payment.receipt_url;
                }
            } catch (error) {
                console.error('Error loading payment details:', error);
            }
        });

        function downloadReceipt() {
            if (currentReceiptUrl) {
                window.open(currentReceiptUrl, '_blank');
            } else {
                alert('Receipt not available. Please contact support.');
            }
        }
    </script>
</body>
</html>
